name: Release

on:
  push:
    tags:
      - '**/v*.*.*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name (web, api, shared)'
        required: true
        type: choice
        options:
          - web
          - api
          - shared
      version:
        description: 'Version (e.g., 0.2.0)'
        required: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import os

          tag_name = os.getenv('GITHUB_REF_NAME', '')
          repo = os.getenv('GITHUB_REPOSITORY')

          if '/' in tag_name:
            version = tag_name.split('/')[-1].lstrip('v')
          else:
            version = '0.0.0'

          # We look for "## [version] - date" line
          version_line = f'## [{version}]'

          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
            lines = f.readlines()

          # Find start and end of section
          start_idx = None
          end_idx = None

          for i, line in enumerate(lines):
            stripped = line.strip()
            if stripped.startswith(version_line):
              start_idx = i
            elif start_idx is not None and stripped.startswith('## ['):
              end_idx = i
              break

          if start_idx is not None:
            body = ''.join(lines[start_idx:end_idx if end_idx else None]).strip()
            print(f"Found section starting at line {start_idx}, ending at line {end_idx}, body len={len(body)}")
            print(f"First 100 chars: {body[:100]}")
          else:
            body = f"Release {tag_name}"
            print(f"Version section not found, using default: {body}")

          # Create release via GitHub API
          url = f'https://api.github.com/repos/{repo}/releases'
          payload = {
              'tag_name': tag_name,
              'name': tag_name,
              'draft': False,
              'prerelease': False,
              'body': body
          }

          data = json.dumps(payload).encode('utf-8')
          req = urllib.request.Request(url, data=data, method='POST')
          req.add_header('Authorization', f"token {os.getenv('GITHUB_TOKEN')}")
          req.add_header('Accept', 'application/vnd.github+json')
          req.add_header('Content-Type', 'application/json')
          req.add_header('X-GitHub-Api-Version', '2022-11-28')

          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
                  print(f"SUCCESS: Created release at {result.get('html_url')}")
                  print(f"Body length in response: {len(result.get('body', ''))}")
          except urllib.request.HTTPError as e:
              error_body = e.read().decode('utf-8')
              print(f"HTTP Error {e.code}: {error_body}")
              exit(1)
          PYEOF