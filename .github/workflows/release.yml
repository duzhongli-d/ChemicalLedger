name: Release

on:
  push:
    tags:
      - '**/v*.*.*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name (web, api, shared)'
        required: true
        type: choice
        options:
          - web
          - api
          - shared
      version:
        description: 'Version (e.g., 0.2.0)'
        required: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import os

          tag_name = os.getenv('GITHUB_REF_NAME', '')

          if '/' in tag_name:
            version = tag_name.split('/')[-1].lstrip('v')
          else:
            version = '0.0.0'

          print(f"Processing tag: {tag_name}, version: {version}")

          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
            content = f.read()

          # Find the Unreleased section
          unreleased_start = content.find('## [Unreleased]')
          if unreleased_start != -1:
            # Find the next version section or end of file
            next_section = content.find('\n## [', unreleased_start + 1)
            if next_section == -1:
              next_section = len(content)
            body = content[unreleased_start:next_section].strip()
            print(f"Found [Unreleased] section, body length: {len(body)}")
            if not body or body == '## [Unreleased]':
              print("WARNING: [Unreleased] section is empty. Using default.")
              body = f"Release {tag_name}"
          else:
            body = f"Release {tag_name}"
            print(f"No [Unreleased] section found, using: {body}")

          print(f"Body preview: {body[:200]}...")

          # Create release via GitHub API
          repo = os.getenv('GITHUB_REPOSITORY')
          url = f'https://api.github.com/repos/{repo}/releases'
          payload = {
              'tag_name': tag_name,
              'name': tag_name,
              'draft': False,
              'prerelease': False,
              'body': body
          }

          data = json.dumps(payload).encode('utf-8')
          req = urllib.request.Request(url, data=data, method='POST')
          req.add_header('Authorization', f"token {os.getenv('GITHUB_TOKEN')}")
          req.add_header('Accept', 'application/vnd.github+json')
          req.add_header('Content-Type', 'application/json')
          req.add_header('X-GitHub-Api-Version', '2022-11-28')

          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
                  print(f"SUCCESS: Created release at {result.get('html_url')}")
          except urllib.request.HTTPError as e:
              error_body = e.read().decode('utf-8')
              print(f"HTTP Error {e.code}: {error_body}")
              exit(1)
          PYEOF