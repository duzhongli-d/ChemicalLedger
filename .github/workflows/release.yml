name: Release

on:
  push:
    tags:
      - '**/v*.*.*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name (web, api, shared)'
        required: true
        type: choice
        options:
          - web
          - api
          - shared
      version:
        description: 'Version (e.g., 0.2.0)'
        required: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract package and version from tag
        id: parse-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "package=${{ inputs.package }}" >> $GITHUB_OUTPUT
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            PACKAGE="${TAG_NAME%%/*}"
            VERSION="${TAG_NAME#*/}"
            echo "package=${PACKAGE}" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release via Python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 << 'PYEOF'
import urllib.request
import urllib.parse
import json
import re
import os

tag_name = os.getenv('GITHUB_REF_NAME', '')
if '/' in tag_name:
    version = tag_name.split('/')[-1].lstrip('v')
else:
    version = os.getenv('INPUT_VERSION', '0.0.0')

with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
    content = f.read()

pattern = rf'## \[{re.escape(version)}\][\s\S]*?(?=\n## |\Z)'
match = re.search(pattern, content)
body = match.group(0).strip() if match else ""

repo = os.getenv('GITHUB_REPOSITORY')
url = f'https://api.github.com/repos/{repo}/releases'

payload = json.dumps({
    'tag_name': tag_name,
    'name': tag_name,
    'draft': False,
    'prerelease': False,
    'body': body
})

data = payload.encode('utf-8')
req = urllib.request.Request(url, data=data, method='POST')
req.add_header('Authorization', f'token {os.getenv("GITHUB_TOKEN")}')
req.add_header('Accept', 'application/vnd.github+json')
req.add_header('X-GitHub-Api-Version', '2022-11-28')
req.add_header('Content-Type', 'application/json')

try:
    with urllib.request.urlopen(req) as resp:
        result = json.loads(resp.read())
        print(f"Created release: {result.get('html_url', 'no url')}")
        print(f"Body length: {len(result.get('body', ''))}")
except urllib.request.HTTPError as e:
    error_body = e.read().decode('utf-8')
    print(f"HTTP Error {e.code}: {error_body}")
    exit(1)
PYEOF