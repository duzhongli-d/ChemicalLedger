name: Release

on:
  push:
    tags:
      - '**/v*.*.*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name (web, api, shared)'
        required: true
        type: choice
        options:
          - web
          - api
          - shared
      version:
        description: 'Version (e.g., 0.2.0)'
        required: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract package and version from tag
        id: parse-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "package=${{ inputs.package }}" >> $GITHUB_OUTPUT
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            PACKAGE="${TAG_NAME%%/*}"
            VERSION="${TAG_NAME#*/}"
            echo "package=${PACKAGE}" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog for release
        id: changelog
        run: |
          python3 << 'PYEOF'
          import re
          import os
          import json

          tag_name = os.getenv('GITHUB_REF_NAME', '')
          if '/' in tag_name:
            version = tag_name.split('/')[-1].lstrip('v')
          else:
            version = os.getenv('INPUT_VERSION', '0.0.0')

          with open('CHANGELOG.md', 'r') as f:
            content = f.read()

          pattern = rf'## \[{re.escape(version)}\][\s\S]*?(?=\n## |\Z)'
          match = re.search(pattern, content)

          body = match.group(0).strip() if match else ""

          # Use JSON to safely encode multiline string for GITHUB_OUTPUT
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"body={json.dumps(body)}\n")

          print(f"Extracted {len(body)} chars for version {version}")
          print(f"First 100 chars: {body[:100] if body else 'EMPTY'}")
          PYEOF

      - name: Debug changelog output
        run: |
          echo "Body length: ${{ steps.changelog.outputs.body && length(steps.changelog.outputs.body) || 0 }}"
          echo "Body first 200 chars: ${{ steps.changelog.outputs.body && substring(steps.changelog.outputs.body, 0, 200) || 'NOT SET' }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}