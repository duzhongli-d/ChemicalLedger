name: Release

on:
  push:
    tags:
      - '**/v*.*.*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name (web, api, shared)'
        required: true
        type: choice
        options:
          - web
          - api
          - shared
      version:
        description: 'Version (e.g., 0.2.0)'
        required: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract package and version from tag
        id: parse-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "package=${{ inputs.package }}" >> $GITHUB_OUTPUT
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            PACKAGE="${TAG_NAME%%/*}"
            VERSION="${TAG_NAME#*/}"
            echo "package=${PACKAGE}" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Write changelog body to file
        run: |
          python3 << 'PYEOF'
          import re

          tag_name = "${{ github.ref_name }}"
          if '/' in tag_name:
            version = tag_name.split('/')[-1].lstrip('v')
          else:
            version = "0.0.0"

          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
            content = f.read()

          pattern = rf'## \[{re.escape(version)}\][\s\S]*?(?=\n## |\Z)'
          match = re.search(pattern, content)
          body = match.group(0).strip() if match else ""

          # Normalize line endings to LF
          body = body.replace('\r\n', '\n').replace('\r', '\n')

          with open('.github/release_body.md', 'w', encoding='utf-8', newline='\n') as f:
            f.write(body)

          print(f"Wrote {len(body)} chars to .github/release_body.md")
          print(f"Preview: {body[:200] if body else 'EMPTY'}")
          PYEOF

      - name: Debug release body file
        run: |
          echo "File exists: $(test -f .github/release_body.md && echo YES || echo NO)"
          echo "File size: $(wc -c < .github/release_body.md 2>/dev/null || echo 'N/A')"
          echo "First 200 chars:"
          head -c 200 .github/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          body_path: .github/release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}