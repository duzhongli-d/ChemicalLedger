name: Release

on:
  push:
    tags:
      - '**/v*.*.*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name (web, api, shared)'
        required: true
        type: choice
        options:
          - web
          - api
          - shared
      version:
        description: 'Version (e.g., 0.2.0)'
        required: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract package and version from tag
        id: parse-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "package=${{ inputs.package }}" >> $GITHUB_OUTPUT
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            PACKAGE="${TAG_NAME%%/*}"
            VERSION="${TAG_NAME#*/}"
            echo "package=${PACKAGE}" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog body to file
        run: |
          python3 << 'PYEOF'
          import re

          tag_name = "${{ github.ref_name }}"
          if '/' in tag_name:
            version = tag_name.split('/')[-1].lstrip('v')
          else:
            version = "${{ inputs.version }}"

          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
            content = f.read()

          pattern = rf'## \[{re.escape(version)}\][\s\S]*?(?=\n## |\Z)'
          match = re.search(pattern, content)
          body = match.group(0).strip() if match else ""

          with open('.github/release_body.txt', 'w', encoding='utf-8') as f:
            f.write(body)

          print(f"Wrote {len(body)} chars to .github/release_body.txt")
          print(f"First 100: {body[:100] if body else 'EMPTY'}")
          PYEOF

      - name: Create GitHub Release with gh cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use a tempfile to safely pass multiline body
          BODY_FILE=".github/release_body.txt"

          # Verify file exists and has content
          if [ -f "$BODY_FILE" ]; then
            echo "Body file size: $(wc -c < "$BODY_FILE") bytes"
            echo "First 100 chars of body:"
            head -c 100 "$BODY_FILE"
            echo ""
          else
            echo "ERROR: Body file not found"
            exit 1
          fi

          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file "$BODY_FILE"

      - name: Verify release created
        run: |
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"