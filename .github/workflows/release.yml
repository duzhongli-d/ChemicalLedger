name: Release

on:
  push:
    tags:
      - '**/v*.*.*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name (web, api, shared)'
        required: true
        type: choice
        options:
          - web
          - api
          - shared
      version:
        description: 'Version (e.g., 0.2.0)'
        required: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract package and version from tag
        id: parse-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "package=${{ inputs.package }}" >> $GITHUB_OUTPUT
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            PACKAGE="${TAG_NAME%%/*}"
            VERSION="${TAG_NAME#*/}"
            echo "package=${PACKAGE}" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog for release
        id: changelog
        run: |
          python3 << 'PYEOF'
          import re
          import os
          import urllib.parse

          tag_name = os.getenv('GITHUB_REF_NAME', '')
          if '/' in tag_name:
            version = tag_name.split('/')[-1].lstrip('v')
          else:
            version = os.getenv('INPUT_VERSION', '0.0.0')

          with open('CHANGELOG.md', 'r') as f:
            content = f.read()

          pattern = rf'## \[{re.escape(version)}\][\s\S]*?(?=\n## |\Z)'
          match = re.search(pattern, content)

          body = ""
          if match:
            body = match.group(0).strip()

          with open('.github/changelog_body.txt', 'w') as f:
            f.write(body)

          print(f"Extracted {len(body)} chars")
          PYEOF

      - name: Create GitHub Release
        run: |
          TAG="${{ github.ref_name }}"
          BODY=$(cat .github/changelog_body.txt)
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/releases \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":$(echo "$BODY" | jq -Rs '.'),\"draft\":false,\"prerelease\":false}"