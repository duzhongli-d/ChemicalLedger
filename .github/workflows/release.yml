name: Release

on:
  push:
    tags:
      - '**/v*.*.*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name (web, api, shared)'
        required: true
        type: choice
        options:
          - web
          - api
          - shared
      version:
        description: 'Version (e.g., 0.2.0)'
        required: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release via API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import re
          import os

          tag_name = os.getenv('GITHUB_REF_NAME', '')
          repo = os.getenv('GITHUB_REPOSITORY')

          # Extract version from tag
          if '/' in tag_name:
            version = tag_name.split('/')[-1].lstrip('v')
          else:
            version = '0.0.0'

          # Read CHANGELOG.md and extract section for this version
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
            content = f.read()

          pattern = rf'## \[{re.escape(version)}\][\s\S]*?(?=\n## |\Z)'
          match = re.search(pattern, content)
          body = match.group(0).strip() if match else ""

          # Write release data to a temp JSON file
          payload = {
              'tag_name': tag_name,
              'name': tag_name,
              'draft': False,
              'prerelease': False,
              'body': body
          }

          with open('.release_payload.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False)

          print(f"Payload prepared: version={version}, body_len={len(body)}")
          print(f"First 200 chars of body: {body[:200]}")
          print(f"Payload file exists: {os.path.exists('.release_payload.json')}")
          PYEOF

      - name: Upload release payload and create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read payload and make API call
          python3 << 'PYEOF'
          import urllib.request
          import json
          import os

          with open('.release_payload.json', 'r', encoding='utf-8') as f:
              payload = json.load(f)

          repo = os.getenv('GITHUB_REPOSITORY')
          url = f'https://api.github.com/repos/{repo}/releases'

          data = json.dumps(payload).encode('utf-8')
          req = urllib.request.Request(url, data=data, method='POST')
          req.add_header('Authorization', f"token {os.getenv('GITHUB_TOKEN')}")
          req.add_header('Accept', 'application/vnd.github+json')
          req.add_header('Content-Type', 'application/json')
          req.add_header('X-GitHub-Api-Version', '2022-11-28')

          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
                  print(f"SUCCESS: Created release at {result.get('html_url')}")
                  print(f"Body length in response: {len(result.get('body', ''))}")
          except urllib.request.HTTPError as e:
              error_body = e.read().decode('utf-8')
              print(f"HTTP Error {e.code}: {error_body}")
              exit(1)
          PYEOF