name: Release

on:
  push:
    tags:
      - '**/v*.*.*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name (web, api, shared)'
        required: true
        type: choice
        options:
          - web
          - api
          - shared
      version:
        description: 'Version (e.g., 0.2.0)'
        required: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog body
        run: |
          python3 << 'PYEOF'
          import re
          import os

          tag_name = os.getenv('GITHUB_REF_NAME', '')
          if '/' in tag_name:
            version = tag_name.split('/')[-1].lstrip('v')
          else:
            version = '0.0.0'

          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
            content = f.read()

          pattern = rf'## \[{re.escape(version)}\][\s\S]*?(?=\n## |\Z)'
          match = re.search(pattern, content)
          body = match.group(0).strip() if match else ""

          # Write to a shared state file
          with open('.release_body.json', 'w') as f:
            import json
            json.dump({'body': body, 'version': version, 'tag': tag_name}, f)

          print(f"Extracted {len(body)} chars for version {version}")
          PYEOF

      - name: Create release via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat .release_body.json

      - name: Debug gh auth
        run: |
          gh auth status

      - name: Debug body file
        run: |
          ls -la .release_body.json
          python3 -c "import json; d=json.load(open('.release_body.json')); print('body length:', len(d['body'])); print('first 200:', d['body'][:200])"

      - name: Create GitHub Release with gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json
          import subprocess
          import os

          with open('.release_body.json', 'r') as f:
            data = json.load(f)

          tag_name = data['tag']
          body = data['body']

          # Write to notes file
          notes_path = '.github/RELEASE_NOTES.md'
          os.makedirs('.github', exist_ok=True)
          with open(notes_path, 'w', encoding='utf-8', newline='\n') as f:
            f.write(body)

          print(f"Notes file written. Size: {len(body)} chars")

          # Verify file exists
          with open(notes_path, 'r') as f:
            verify = f.read()
          print(f"Verification read: {len(verify)} chars")

          # Call gh
          result = subprocess.run(
              ['gh', 'release', 'create', tag_name,
               '--title', tag_name,
               '--notes-file', notes_path],
              capture_output=True, text=True
          )
          print(f"gh output: {result.stdout}")
          print(f"gh stderr: {result.stderr}")
          print(f"gh return code: {result.returncode}")
          PYEOF