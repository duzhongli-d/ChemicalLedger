[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Development: sqlalchemy.url = postgresql://postgres:postgres123@localhost:5432/qc_platform
# Production (distributed): sqlalchemy.url = postgresql://user:password@192.168.1.100:5432/qc_platform
sqlalchemy.url = postgresql://postgres:postgres123@localhost:5432/qc_platform

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
